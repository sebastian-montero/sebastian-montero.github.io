                <h1 id="desierto">desierto</h1>
                <time class="post-date" datetime="2024-03-10">10 de marzo de 2024</time>
                <p>agua en el desierto<br>
                   tu amor llueve en mi corazón<br>
                   cantan los amaneceres<br>
                   tu voz es luz en mi temor<br>
                   te quiero y no te quiero<br>
                   tener cerca y luego perder<br>
                   me asusta el oscuro<br>
                   atardecer del futuro.</p>
            </article>
